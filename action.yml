name: Precall
description: Comment on pull requests that match rules learned from your repository's own history
author: Creste LLC
branding:
  icon: git-pull-request
  color: orange
inputs:
  github-token:
    description: GitHub token used to read the pull request and write comments
    default: ${{ github.token }}
  rules-file:
    description: Path to the committed Precall rules file, relative to the workspace
    default: .heed/rules.json
  min-rules:
    description: Minimum breached rules required before Precall reports
    default: ""
  min-lift:
    description: Minimum rule strength to report
    default: ""
  max-inline:
    description: Maximum inline comments, capped at 10
    default: ""
  inline:
    description: Whether to create inline comments
    default: ""
  check:
    description: Whether to publish a Precall check run
    default: ""
  fail-on-match:
    description: Fail the job when rules match above the threshold
    default: ""
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
    - run: bun "$GITHUB_ACTION_PATH/dist/main.js"
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        HEED_RULES: ${{ inputs.rules-file }}
        HEED_MIN_RULES: ${{ inputs.min-rules }}
        HEED_MIN_LIFT: ${{ inputs.min-lift }}
        HEED_MAX_INLINE: ${{ inputs.max-inline }}
        HEED_INLINE: ${{ inputs.inline }}
        HEED_CHECK: ${{ inputs.check }}
        HEED_FAIL_ON_MATCH: ${{ inputs.fail-on-match }}
      shell: bash
